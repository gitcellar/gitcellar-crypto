[package]
name = "bounded-http"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["GitCellar, LLC"]
description = "Size-bounded reads of untrusted HTTP response bodies - the storage provider is the adversary"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitcellar/gitcellar-crypto"

[dependencies]
# `stream` is required: the ceiling is enforced by counting bytes as they
# arrive, which needs `Response::chunk`.
reqwest = { version = "0.12", features = ["stream"] }
thiserror = "1.0"

[dev-dependencies]
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

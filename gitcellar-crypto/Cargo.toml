[package]
name = "gitcellar-crypto"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
authors = ["GitCellar, LLC"]
description = "Encryption library for GitCellar - Sequoia-based OpenPGP identity, key grants, and cloud backup"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitcellar/gitcellar-crypto"
keywords = ["encryption", "git", "zero-access", "openpgp", "sequoia"]
categories = ["cryptography"]

# The `key-directory` feature (client for an auditable public-key log) exists in the
# in-tree build and is not part of this published crate yet; the cfg is declared
# here so the compiler knows the gate is intentional.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("key-directory"))'] }

[dependencies]
gitcellar-identity = { path = "../gitcellar-identity" }
vault-core = { path = "../vault-core" }

anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Hashing / KDF / encoding
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand = "0.8"
base64 = "0.21"

# Recovery-code-derived encryption for identity bundles (not the chunk path)
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"

# Multi-device recovery: raw Ed25519 over canonical CBOR for device and
# revocation certificates (OpenPGP is used for content and grants, not here)
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
zeroize = { version = "1.7", features = ["zeroize_derive"] }
ciborium = "0.2"
serde_bytes = "0.11"
static_assertions = "1.1"
bip39 = "2.0"

dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.35", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }
proptest = "1.4"

# Platform-specific cryptographic backends for Sequoia OpenPGP
[target.'cfg(windows)'.dependencies]
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-cng"] }

[target.'cfg(not(windows))'.dependencies]
sequoia-openpgp = { version = "2.4", default-features = false, features = ["crypto-nettle"] }

[package]
name = "gitcellar-crypto"
version = "0.1.0"
edition = "2021"
authors = ["GitCellar, LLC"]
description = "Unified encryption library for GitCellar - Sequoia-based identity and encryption"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gitcellar/gitcellar-crypto"
keywords = ["encryption", "git", "zero-access", "openpgp", "sequoia"]
categories = ["cryptography"]

[dependencies]
# GitCellar identity (wraps passkey-core with GitCellar defaults)
gitcellar-identity = { path = "../gitcellar-identity" }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Cryptography utilities
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
base64 = "0.21"

# Password-based encryption for .gckey files
argon2 = "0.5"
aes-gcm = "0.10"
hkdf = "0.12"

# Platform utilities
dirs = "5.0"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Async
tokio = { version = "1.35", features = ["rt-multi-thread"] }

# Chunking (shared with service)
vault-core = { path = "../vault-core" }

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.35", features = ["rt-multi-thread", "macros"] }

# Platform-specific cryptography backends for Sequoia OpenPGP
[target.'cfg(windows)'.dependencies]
sequoia-openpgp = { version = "1.17", default-features = false, features = ["crypto-cng"] }

[target.'cfg(not(windows))'.dependencies]
sequoia-openpgp = { version = "1.17", default-features = false, features = ["crypto-nettle"] }

# cbindgen configuration for vault-core C bindings
# See: https://github.com/mozilla/cbindgen/blob/master/docs.md

language = "C"
header = """
/* vault-core C bindings
 *
 * Cross-platform encrypted backup library
 * Auto-generated by cbindgen - DO NOT EDIT
 *
 * This header provides C-compatible functions for:
 * - Content-defined chunking
 * - GPG/AES encryption
 * - S3-compatible cloud storage
 *
 * Memory Management:
 * - All returned pointers must be freed with the corresponding vault_*_free() function
 * - Error messages are copied to caller-provided buffers
 * - Byte arrays use VaultBuffer struct which must be freed with vault_buffer_free()
 */
"""
include_guard = "VAULT_CORE_H"
autogen_warning = "/* Warning: this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
namespace = "vault"
cpp_compat = true

[defines]
# Feature flag mappings
"feature = ffi" = "VAULT_FFI"
"feature = gpg" = "VAULT_GPG"
"feature = aes-only" = "VAULT_AES_ONLY"

[export]
prefix = "Vault"
include = []
exclude = []
renaming_overrides_prefixing = true

[export.rename]
# Rename Rust types to C-friendly names
"ChunkConfig" = "VaultChunkConfig"
"Chunk" = "VaultChunk"
"ChunkMetadata" = "VaultChunkMetadata"

[enum]
rename_variants = "QualifiedScreamingSnakeCase"
prefix_with_name = true

[struct]
rename_fields = "SnakeCase"

[fn]
# Function naming
rename_args = "SnakeCase"
args = "vertical"
sort_by = "Name"

[parse]
parse_deps = false
include = []
extra_bindings = []

[parse.expand]
crates = ["vault-core"]
all_features = true

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is surfaced against an unchanged tree.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Nettle (Sequoia OpenPGP backend on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nettle-dev libclang-dev pkg-config
      - name: Build Nettle 3 (Sequoia OpenPGP backend on macOS)
        # Homebrew ships Nettle 4, which deleted the pgp.h header that
        # nettle-sys still binds, so Sequoia's Nettle backend needs Nettle 3.x.
        if: runner.os == 'macOS'
        run: |
          brew install gmp pkg-config m4
          curl -sSLO https://ftp.gnu.org/gnu/nettle/nettle-3.10.2.tar.gz
          tar xzf nettle-3.10.2.tar.gz
          cd nettle-3.10.2
          ./configure --prefix="$HOME/nettle3" --disable-documentation \
            CPPFLAGS="-I$(brew --prefix gmp)/include" LDFLAGS="-L$(brew --prefix gmp)/lib"
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "PKG_CONFIG_PATH=$HOME/nettle3/lib/pkgconfig:$(brew --prefix gmp)/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "BINDGEN_EXTRA_CLANG_ARGS=-I$HOME/nettle3/include" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    name: minimum supported Rust (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - run: sudo apt-get update && sudo apt-get install -y nettle-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

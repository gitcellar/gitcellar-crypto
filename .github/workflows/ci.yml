name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published advisory is surfaced against an unchanged tree.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Nettle (Sequoia OpenPGP backend on Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y nettle-dev libclang-dev pkg-config
      - name: Install Nettle (Sequoia OpenPGP backend on macOS)
        if: runner.os == 'macOS'
        run: brew install nettle pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --all-targets
      - run: cargo test --workspace

  msrv:
    name: minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: sudo apt-get update && sudo apt-get install -y nettle-dev libclang-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  audit:
    name: cargo audit (RustSec advisories)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
